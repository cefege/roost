# Stable toolchain shared by native, wasm and container builds.
# Keep the Docker build image aligned; the web SDK does not need nightly.
[toolchain]
channel = "1.100.0"
profile = "minimal"
# llvm-tools: `dx build` strips the bundle with the toolchain's rust-objcopy,
# which on macOS loads a libLLVM.dylib only this component installs.
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["wasm32-unknown-unknown"]
