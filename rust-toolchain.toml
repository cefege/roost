# Pinned to the stable release rustup installed when v3 was forked. The web
# SDK's wasm build is stable-only, so this file is the single toolchain source
# of truth — do not add a nightly override.
[toolchain]
channel = "1.98.1"
profile = "minimal"
# llvm-tools: `dx build` strips the bundle with the toolchain's rust-objcopy,
# which on macOS loads a libLLVM.dylib only this component installs.
components = ["rustfmt", "clippy", "llvm-tools"]
targets = ["wasm32-unknown-unknown"]
