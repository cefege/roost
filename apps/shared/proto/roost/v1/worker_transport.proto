// crpc5 — coord ↔ worker bidi stream. Worker dials coord once at boot;
// stream stays open. Server-to-server, full duplex.
//
// Replaces /ws/coord-worker/:fp hand-rolled JSON+binary WSS.
// Both directions multiplex control frames (proto oneof) and binary
// PTY bytes (BinaryFrame).

syntax = "proto3";
package roost.v1;

import "roost/v1/events.proto";
import "roost/v1/cell.proto";

// ── Upstream (worker → coord) ────────────────────────────────────

message WHello { string worker_fp = 1; string version = 2; }
message WPong { uint64 ts = 1; }
// D-4b at-least-once delivery: worker stamps a per-worker monotonic
// client_seq on every SessionEvent. Coord inserts under a unique
// constraint (worker_fp, client_seq); retries dedup at the index and
// still get acked. Coord MUST send DEventAck { client_seq } downstream
// after a successful insert OR dedup so the worker drops the entry
// from its unacked outbox.
message WSessionEvent {
  SessionEventProto event = 1;
  uint64 client_seq = 2;
}
message WRpcOk { string request_id = 1; string data_json = 2; }
message WRpcError { string request_id = 1; string message = 2; }
message WTransferLine { string job_id = 1; string text = 2; }
message WTransferDone { string job_id = 1; int32 exit = 2; string error = 3; }
message WBinary { uint32 channel_id = 1; uint32 direction = 2; uint64 seq = 3; bytes data = 4; }

// T2.2 — in-band JWT rotation. Worker sends this BEFORE the current
// JWT expires; coord-side auth interceptor verifies the new token and
// swaps the caller binding for this stream. Stream stays open.
message WRefreshJwt { string jwt = 1; }

// Generation-addressed cell shipping. Small frames travel directly; oversized
// full snapshots travel as bounded whole-row chunks under the same channel.
message WCellGrid { uint32 channel_id = 1; PbCellGridFrame frame = 2; }
message WCellGridChunk { uint32 channel_id = 1; PbCellGridChunk chunk = 2; }

// Volatile agent runtime metadata. The worker owns revision ordering; this
// frame is never placed in the durable event outbox.
message WAgentStatus {
  string session_id = 1;
  string agent_id = 2;
  string state = 3;
  optional string message = 4;
  uint64 revision = 5;
  uint64 completed_revision = 6;
  double updated_at = 7;
  bool active = 8;
}
// Durable Windows update-broker progress. Progress is journal-backed on the
// worker host and replayed after a worker reconnect; sequence is monotonic per
// job. A terminal frame is retained with the journal rather than inferred from
// transport closure.
message WUpdateProgress {
  string request_id = 1;
  string job_id = 2;
  uint64 sequence = 3;
  string phase = 4;
  string message = 5;
  bool terminal = 6;
  bool success = 7;
  string error = 8;
}


// Where a terminal-control request stopped relative to the keeper/PTY write.
// `status` says what happened; the phase is what makes it provable. Only a
// phase strictly before the write can promise no mutation occurred, so it is
// the sole basis on which the coordinator rolls provisional state back and the
// browser retries a request without risking a duplicate write.
enum TerminalWritePhase {
  TERMINAL_WRITE_PHASE_UNSPECIFIED = 0;
  // Refused before anything was written, resized, or claimed.
  TERMINAL_WRITE_PHASE_PRE_WRITE = 1;
  // The keeper/PTY write was issued; its effect may already be visible.
  TERMINAL_WRITE_PHASE_WRITTEN = 2;
  // The worker cannot prove which side of the write it stopped on.
  TERMINAL_WRITE_PHASE_UNKNOWN = 3;
}

// Truthful terminal-control outcomes. These frames are correlated with the
// downstream request_id; unlike the legacy browser-command/binary paths, an
// accepted result proves the keeper completed the PTY operation.
enum TerminalInputStatus {
  TERMINAL_INPUT_STATUS_UNSPECIFIED = 0;
  TERMINAL_INPUT_STATUS_ACCEPTED = 1;
  TERMINAL_INPUT_STATUS_REJECTED = 2;
  TERMINAL_INPUT_STATUS_AMBIGUOUS = 3;
}
message WInputResult {
  string request_id = 1;
  string session_id = 2;
  uint64 input_seq = 3;
  TerminalInputStatus status = 4;
  uint32 written_bytes = 5;
  string reason = 6;
  TerminalWritePhase phase = 7;
}

enum TerminalStreamStatus {
  TERMINAL_STREAM_STATUS_UNSPECIFIED = 0;
  TERMINAL_STREAM_STATUS_COMMITTED = 1;
  TERMINAL_STREAM_STATUS_REJECTED = 2;
  TERMINAL_STREAM_STATUS_AMBIGUOUS = 3;
}

enum TerminalStreamFailureKind {
  TERMINAL_STREAM_FAILURE_KIND_UNSPECIFIED = 0;
  TERMINAL_STREAM_FAILURE_KIND_RETRYABLE_PRE_WRITE = 1;
  TERMINAL_STREAM_FAILURE_KIND_SESSION_NOT_LIVE = 2;
  TERMINAL_STREAM_FAILURE_KIND_INVALID_REQUEST = 3;
  TERMINAL_STREAM_FAILURE_KIND_CORE_FAILED = 4;
  TERMINAL_STREAM_FAILURE_KIND_AMBIGUOUS_BOUNDARY = 5;
}

message WTerminalStreamResult {
  string request_id = 1;
  string session_id = 2;
  string stream_id = 3;
  bool enabled = 4;
  TerminalStreamStatus status = 5;
  uint64 channel_resize_seq = 6;
  uint32 effective_cols = 7;
  uint32 effective_rows = 8;
  bool resized = 9;
  string reason = 10;
  TerminalWritePhase phase = 11;
  TerminalStreamFailureKind failure_kind = 12;
}


message CoordWorkerUp {
  reserved 4, 5, 13, 15;
  reserved "viewport_result";
  oneof frame {
    WHello hello = 1;
    WPong pong = 2;
    WSessionEvent event = 3;
    WRpcOk rpc_ok = 6;
    WRpcError rpc_error = 7;
    WTransferLine transfer_line = 8;
    WTransferDone transfer_done = 9;
    WBinary binary = 10;
    WRefreshJwt refresh_jwt = 11;
    WCellGrid cell_grid = 12;
    WAgentStatus agent_status = 14;
    WInputResult input_result = 16;
    WTerminalStreamResult terminal_stream_result = 17;
    WCellGridChunk cell_grid_chunk = 18;
    WUpdateProgress update_progress = 30;
  }
}

// ── Downstream (coord → worker) ──────────────────────────────────

message DHelloAck { string coord_pubkey_b64 = 1; string coord_pubkey_kid = 2; }
message DPing { uint64 ts = 1; }
message DBrowserCommand {
  string browser_id = 1;
  string viewer_id = 2;
  string request_id = 3;
  string frame_json = 4;
}
message DBinary { uint32 channel_id = 1; uint32 direction = 2; bytes data = 3; }
message DEventAck { uint64 client_seq = 1; }

// Dedicated terminal-control requests. Input stays session-scoped. Terminal
// stream state carries the coordinator's already-aggregated geometry and one
// generation ID; no per-viewer membership crosses this boundary.
//
// `budget_ms` is the RELATIVE time the coordinator will still wait when it
// writes the frame, never an absolute instant: the two hosts' wall clocks may
// drift arbitrarily, so each side measures its own monotonic elapsed time from
// a local origin. The worker's budget is strictly shorter than the
// coordinator's remaining deadline, so a worker expiry can never outlive its
// waiter and expiring before the keeper write is provably no-mutation.
message DInputRequest {
  string request_id = 1;
  string session_id = 2;
  uint64 input_seq = 3;
  bytes data = 4;
  uint32 budget_ms = 5;
}

message DTerminalStreamState {
  string request_id = 1;
  string session_id = 2;
  string stream_id = 3;
  bool enabled = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  uint32 budget_ms = 7;
}

// Fire-and-forget repair request. Repeating it replaces any partial same-stream
// snapshot cursor with a fresh snapshot_id and full baseline.
message DTerminalSnapshotRequest {
  string session_id = 1;
  string stream_id = 2;
}

message DAttachmentChunk {
  string request_id = 1;
  string session_id = 2;
  string filename = 3;
  bool short_path = 4;
  bytes data = 5;
  bool last = 6;
  uint32 seq = 7;
}

message DCoordMovePrepare {
  string request_id = 1;
  string handoff_id = 2;
  string source_url = 3;
  string target_url = 4;
  string expected_coord_kid = 5;
  string expected_git_sha = 6;
  uint64 estimated_db_size = 7;
  string action = 8;
}

message DCoordMoveSnapshotStart {
  string request_id = 1;
  string handoff_id = 2;
  uint64 total_size = 3;
  string sha256 = 4;
  bytes coord_key_pem = 5;
  bytes authorized_keys = 6;
  string secret_sha256 = 7;
  repeated string expected_worker_fps = 8;
}

message DCoordMoveSnapshotChunk {
  string handoff_id = 1;
  uint32 seq = 2;
  bytes data = 3;
  bool last = 4;
}

message DCoordRelocate {
  string request_id = 1;
  string handoff_id = 2;
  string source_url = 3;
  string target_url = 4;
  string action = 5;
}

// Authenticated coordinator control for the out-of-job Windows updater. The
// worker validates the detached vendor signature before it creates the local
// journal and asks SCM to start RoostUpdaterV2. STATUS replays persisted
// progress and never starts a second broker.
message DUpdateBroker {
  string request_id = 1;
  string job_id = 2;
  string action = 3; // START | STATUS
  string manifest_url = 4;
  string signature_url = 5;
  string manifest_sha256 = 6;
  string publisher_sha256 = 7;
}

message CoordWorkerDown {
  reserved 11;
  reserved "viewport_request";
  oneof frame {
    DHelloAck hello_ack = 1;
    DPing ping = 2;
    DBrowserCommand browser_command = 3;
    DBinary binary = 4;
    DEventAck event_ack = 5;
    DAttachmentChunk attachment_chunk = 6;
    DCoordMovePrepare coord_move_prepare = 7;
    DCoordMoveSnapshotStart coord_move_snapshot_start = 8;
    DCoordMoveSnapshotChunk coord_move_snapshot_chunk = 9;
    DCoordRelocate coord_relocate = 10;
    DInputRequest input_request = 12;
    DTerminalStreamState terminal_stream_state = 13;
    DTerminalSnapshotRequest terminal_snapshot_request = 14;
    DUpdateBroker update_broker = 30;
  }
}

service WorkerService {
  rpc Attach(stream CoordWorkerUp) returns (stream CoordWorkerDown);
}
