// Sync — single Connect server-streaming RPC replacing sync.firehose
// tRPC subscription. Multiplexes coordinator state buses plus authoritative
// terminal cell grids and compact terminal-link metadata over one stream.
//
// Wire shape: FirehoseFrame oneof. Event-typed variants carry a JSON
// payload (existing per-domain event shapes from @roost/shared/wire).

syntax = "proto3";
package roost.v1;

import "roost/v1/events.proto";
import "roost/v1/wire.proto";
import "roost/v1/cell.proto";

message SyncRequest {
  // T1.4 — reconnect backfill. SPA persists the last event id it saw
  // (server-stamped on each SessionEvent) and passes it on reopen.
  // Coord replays event rows with id > since_event_id before subscribing
  // to live publishes. 0 = no backfill (first connect).
  uint64 since_event_id = 1;
}

// Generic event variants — payload_json carries the existing per-domain
// event shape verbatim. SPA decodes JSON and dispatches into existing
// projector handlers. Migration path: when each handler ports to proto,
// these get replaced with typed message variants.
message JsonEvent {
  string payload_json = 1;
}

// Field 30 (terminal_link / TerminalLinkFrame) is RETIRED, not moved: OSC 8
// hyperlinks are core-authored per-cell identity on PbCellSpan.link_uri /
// link_key now, so no coordinator-derived text->URI mapping exists to ship.

message SessionPresence {
  string session_id = 1;
  string payload_json = 2;
}


// OSC 0/2 terminal title, parsed centrally by coord (terminal-title-hub) from
// the same relayed byte stream and fanned out here. Volatile (re-derived from
// output) — NOT backfilled on reconnect; seeded on Sync connect like status.
message TerminalTitleFrame {
  string session_id = 1;
  string title = 2;
}

// Last-activity timestamp (ms) per session, stamped centrally by coord
// (last-activity-hub) on PTY byte flow and fanned out here (throttled).
// Drives the sidebar "Last activity" filter aging out idle OPEN sessions.
// Volatile — seeded on Sync connect, throttled live updates after. double
// (not int64) so protobuf-es keeps it a JS number, not bigint.
message LastActivityFrame {
  string session_id = 1;
  double ts_ms = 2;
}


// Live worker routability = coord's raw-WS membership (connectWorkers). Full
// current set, published on every connect/disconnect + seeded on Sync connect.
// SPA replaces its routable set wholesale → the online indicator stops lying.
message WorkerRoutableFrame {
  repeated string fps = 1;
  // V2 retained seeds are bounded chunks. Empty snapshot_id means a live
  // full-set replacement (legacy behavior).
  string snapshot_id = 2;
  uint32 chunk_index = 3;
  uint32 chunk_count = 4;
}

message CoordinatorRelocationFrame {
  string handoff_id = 1;
  string source_url = 2;
  string target_url = 3;
}

// Volatile agent runtime metadata. Inactive frames delete the retained status
// for a session; active frames are seeded on Sync reconnect.
message AgentStatusFrame {
  string session_id = 1;
  string agent_id = 2;
  string state = 3;
  optional string message = 4;
  uint64 revision = 5;
  uint64 completed_revision = 6;
  double updated_at = 7;
  bool active = 8;
}


// Sync v2 divides application traffic into independently hydrated domains.
// Enum values are stable wire identifiers; controls themselves are never
// delivery-sequenced and therefore never consume the application ACK window.
enum SyncDomain {
  reserved 5, 8;
  reserved "SYNC_DOMAIN_PERMISSIONS", "SYNC_DOMAIN_WEBHOOK";
  SYNC_DOMAIN_UNSPECIFIED = 0;
  SYNC_DOMAIN_TERMINAL = 1;
  SYNC_DOMAIN_WORKERS = 2;
  SYNC_DOMAIN_WORKSPACES = 3;
  SYNC_DOMAIN_TASKS = 4;
  SYNC_DOMAIN_MCP = 6;
  SYNC_DOMAIN_PAIR = 7;
  SYNC_DOMAIN_AUDIT = 9;
}

message SyncDomainGeneration {
  SyncDomain domain = 1;
  uint64 generation = 2;
  bool subscribed = 3;
}

message SyncSubscribedFrame {
  string socket_id = 1;
  string process_epoch = 2;
  repeated SyncDomainGeneration generations = 3;
}

message SyncDomainResetFrame {
  SyncDomain domain = 1;
  uint64 generation = 2;
  string reason = 3;
  bool subscribed = 4;
}

message SyncDomainReadyCommand {
  SyncDomain domain = 1;
  uint64 generation = 2;
  optional string snapshot_token = 3;
}

message SyncDomainSubscriptionCommand {
  SyncDomain domain = 1;
  uint64 generation = 2;
}

// Terminal views are socket-bound leases. `revision` orders one mount's
// activity/geometry intent; a replay with the same revision and payload is
// idempotent across a Sync redial.
message TerminalViewCommand {
  string view_id = 1;
  string session_id = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  uint64 revision = 5;
  bool active = 6;
  uint64 domain_generation = 7;
}

// Browser repair request for the stream/baseline it currently expects.
message TerminalResyncCommand {
  string view_id = 1;
  string session_id = 2;
  string stream_id = 3;
  string grid_epoch = 4;
  uint64 seq = 5;
  uint64 domain_generation = 6;
}

enum TerminalViewStatus {
  TERMINAL_VIEW_STATUS_UNSPECIFIED = 0;
  TERMINAL_VIEW_STATUS_ACCEPTED = 1;
  TERMINAL_VIEW_STATUS_REJECTED = 2;
  TERMINAL_VIEW_STATUS_UNAVAILABLE = 3;
}

// Recipient-addressed state for one view handle. Active accepted views share
// the stream/effective geometry for their session while retaining their own
// view_id and revision.
message TerminalViewStateFrame {
  string view_id = 1;
  string session_id = 2;
  uint64 revision = 3;
  bool active = 4;
  string stream_id = 5;
  TerminalViewStatus status = 6;
  uint32 effective_cols = 7;
  uint32 effective_rows = 8;
  string reason = 9;
}

message InputCommand {
  string session_id = 1;
  uint64 input_seq = 2;
  bytes data = 3;
  uint64 domain_generation = 4;
  optional string view_id = 5;
}

message InputAccepted {
  string session_id = 1;
  uint64 input_seq = 2;
  uint64 domain_generation = 3;
  uint32 written_bytes = 4;
}

message InputRejected {
  string session_id = 1;
  uint64 input_seq = 2;
  uint64 domain_generation = 3;
  string reason = 4;
}

message InputAmbiguous {
  string session_id = 1;
  uint64 input_seq = 2;
  uint64 domain_generation = 3;
  uint32 written_bytes = 4;
  string reason = 5;
}


message FirehoseFrame {
  reserved 7, 14, 15, 28, 30, 42, 43, 47;  // retired fields
  reserved "webhook_token_delta", "permission_delta",
    "viewport_accepted", "viewport_rejected", "viewport_ambiguous";
  // Per-socket application-delivery sequence. Zero means legacy/unenforced or
  // an unsequenced v2 control frame.
  uint64 delivery_seq = 31;
  // Present on v2 application frames. Controls leave both fields at zero.
  uint64 domain_generation = 32;
  SyncDomain domain = 33;
  oneof frame {
    JsonEvent sessions = 1;       // legacy fallback: any kind not yet in session_event_proto
    SessionPresence session_presence = 8;
    AuditRow audit_row = 10;
    SessionEventProto session_event = 11;
    // T1.2 part 2 — typed bus deltas. Both sides accept either form;
    // older clients fall back to the JsonEvent equivalents above.
    WorkspaceDeltaProto workspace_delta = 12;
    TaskDeltaProto task_delta = 13;
    McpStreamMessageProto mcp_msg = 16;
    WorkerPresenceProto worker_presence = 17;
    WorkerRoutableFrame worker_routable = 19;
    // R11 cell-grid cell-shipping — pre-rendered grid, SPA paints + never reflows.
    PbCellGridFrame cell_grid = 20;
    // Oversized full snapshots are streamed as bounded whole-row parts.
    PbCellGridChunk cell_grid_chunk = 34;
    TerminalTitleFrame terminal_title = 21;
    LastActivityFrame last_activity = 22;
    PairRequestDeltaProto pair_request_delta = 23;
    // ui-cc is subscriber/control traffic rather than pair-domain hydration.
    UiStateFrame ui_state = 24;
    UiCommandFrame ui_command = 25;
    KeepaliveFrame keepalive = 26;
    CoordinatorRelocationFrame coordinator_relocation = 27;
    AgentStatusFrame agent_status = 29;

    // v2 controls. These are emitted only to sync_v=2 sockets with
    // delivery_seq=0, so cached flow=1 clients never observe them.
    SyncSubscribedFrame subscribed = 40;
    SyncDomainResetFrame domain_reset = 41;
    InputAccepted input_accepted = 44;
    InputRejected input_rejected = 45;
    InputAmbiguous input_ambiguous = 46;
    TerminalViewStateFrame terminal_view_state = 48;
  }
}

// Browser acknowledgement after synchronous application dispatch. ACKs are
// cumulative. A canonical command-only frame omits ack_delivery_seq (or leaves
// it zero); controls never consume or advance the application ACK window.
message SyncClientFrame {
  reserved 5;
  reserved "viewport";
  optional uint64 ack_delivery_seq = 1;
  oneof command {
    SyncDomainSubscriptionCommand domain_subscribe = 2;
    SyncDomainSubscriptionCommand domain_unsubscribe = 3;
    SyncDomainReadyCommand domain_ready = 4;
    InputCommand input = 6;
    TerminalViewCommand terminal_view = 7;
    TerminalResyncCommand terminal_resync = 8;
  }
  // Opaque v2 socket identity from SyncSubscribedFrame. A stale socket id is
  // ignored rather than allowing an old generation to ACK or mutate a new one.
  string socket_id = 10;
}

message KeepaliveFrame {
  int64 ts = 1;
}

// ─── ui-cc: browser-tab UI state + command channel ─────────────────────────
// Layout stays browser-local (localStorage); coord only relays. The tab
// REPORTS its spatial model (UiReportState) and EXECUTES commands
// (UiDispatch → ui_command frame → SPA maps onto store/paneLayout.ts pure
// ops). No browser open → commands no-op; agents detect via UiListStates.

message UiReportStateRequest {
  string tab_id = 1;           // sessionStorage roost.tabId (auth/tab-id.ts)
  string active_path = 2;      // router location, e.g. "/s/<sessionId>"
  string folder_key = 3;       // pane-layout bucket the layout below belongs to
  // Layout tree serialized as-is (store/paneLayout.ts Layout). JSON string
  // keeps the proto stable while the layout model evolves — same pattern as
  // DiagSnapshot.spa_state_json.
  string layout_json = 4;
  string focused_pane_id = 5;
  repeated string visible_session_ids = 6;  // one selectedTab per visible pane
}

// Typed command set — unlike layout_json, commands ARE the contract.
message UiCommand {
  oneof command {
    UiNavigate navigate = 1;
    UiPlaceSplit place_split = 2;
    UiSelectTab select_tab = 3;
    UiFocusPane focus_pane = 4;
    UiMoveTab move_tab = 5;
    UiArrange arrange = 6;
    UiCloseTab close_tab = 7;
    UiSpotlight spotlight = 8;
  }
}

message UiNavigate { string path = 1; }
// Split the pane holding anchor_session_id; the new sibling pane holds
// session_id. dir: "row" (left|right) | "col" (top|bottom). insert_first =
// new pane takes the left/top side.
message UiPlaceSplit {
  string session_id = 1;
  string anchor_session_id = 2;
  string dir = 3;
  bool insert_first = 4;
}
message UiSelectTab { string session_id = 1; }
// Focus the pane currently holding session_id.
message UiFocusPane { string session_id = 1; }
// Move session_id's tab into the pane holding dest_session_id.
message UiMoveTab { string session_id = 1; string dest_session_id = 2; }
// preset: even | rows | tiled | main-vertical | balance (paneLayoutPresets.ts)
message UiArrange { string preset = 1; }
// Soft-close honoring the pendingClose undo window (TerminalDeck doClose).
message UiCloseTab { string session_id = 1; }
message UiSpotlight { string session_id = 1; bool off = 2; }

message UiStateFrame {
  string fp = 1;      // browser key fingerprint (auth identity)
  string tab_id = 2;
  UiReportStateRequest state = 3;
}

message UiCommandFrame {
  string target_tab_id = 1;  // empty = all tabs
  UiCommand command = 2;
}
