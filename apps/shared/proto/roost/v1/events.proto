// T1.2 — proto-ize SessionEvent. Replaces the JsonEvent-with-stringified
// payload pattern with native oneof variants. Adapters in
// apps/shared/src/wire/event-proto.ts marshal between the in-app Zod
// SessionEvent shape and SessionEventProto.
//
// Scope of this initial pass: most-common variants (opened, closed,
// attached, detached, cwd, workspace_assigned). Less common variants
// (agent, snapshot) stay on the JsonEvent fallback path until the
// next iteration — both sides accept either form.

syntax = "proto3";
package roost.v1;

import "roost/v1/wire.proto";

message OpenedEvt {
  string session_id = 1;
  string worker_fp = 2;
  uint32 channel = 3;
  string session_kind = 4;     // "shell" | "claude"
  string cwd = 5;
  uint64 ts = 6;
}

message ClosedEvt {
  string session_id = 1;
  optional int32 exit_code = 2;
  uint64 ts = 3;
}

message AttachedEvt {
  string session_id = 1;
  uint64 ts = 2;
}

message DetachedEvt {
  string session_id = 1;
  uint64 ts = 2;
}

message CwdEvt {
  string session_id = 1;
  string cwd = 2;
  uint64 ts = 3;
}

message WorkspaceAssignedEvt {
  string session_id = 1;
  optional string workspace_id = 2;
  uint64 ts = 3;
}

// Tri-state ops for every clearable nullable AgentState field. oneof
// set = update to a value; clear = clear to null; absent = leave alone.
// Uniform pattern across all four — adding a new clearable field is
// "add one more *Op message" not "what does null mean for X again".
message AgentToolOp {
  oneof op { CurrentTool set = 1; bool clear = 2; }
}
message LastMessageOp {
  oneof op { LastMessage set = 1; bool clear = 2; }
}
message CurrentBlockOp {
  oneof op { CurrentBlock set = 1; bool clear = 2; }
}
message PermissionRequestOp {
  oneof op { PermissionRequest set = 1; bool clear = 2; }
}

// Sparse AgentState patch — emitter sets only fields that changed.
// Field-presence semantics: absent = "leave existing value alone".
// All four nullable fields (current_tool, last_message, current_block,
// permission_request) carry uniform tri-state ops so explicit null-clear
// is wire-supported across the board.
message AgentStatePatch {
  optional string mode = 1;            // ClaudeMode enum as string
  optional string model = 2;
  optional string status = 3;          // AgentStatus enum as string
  Tokens tokens = 4;                   // message-typed presence
  optional double cost_usd = 5;
  LastMessageOp last_message = 6;
  AgentToolOp current_tool = 7;
  CurrentBlockOp current_block = 8;
  PermissionRequestOp permission_request = 9;
  repeated SubAgentRow sub_agents = 10;
  // Distinguish "patch carries sub_agents=[]" (wholesale clear) from
  // "sub_agents not in patch" (leave alone). repeated fields are
  // always-present in proto3; this companion bool is the presence bit.
  bool has_sub_agents = 11;
}

message AgentEvt {
  string session_id = 1;
  AgentStatePatch patch = 2;
  uint64 ts = 3;
}

message SnapshotEvt {
  string worker_fp = 1;
  // Typed Session list — the shared agent-proto.ts adapter handles the
  // AgentState graph in one place, so the wire is uniformly proto.
  repeated Session sessions = 2;
  uint64 ts = 3;
}

// Worker rebooted; session's keeper PTY is gone but the row identity
// stays (same session_id, same cwd, same kind, same workspace). Fold
// updates the session's `channel` to the new keeper allocation and
// clears `agent` so claude re-initializes from the next agent event.
message RespawnedEvt {
  string session_id = 1;
  uint32 new_channel = 2;
  uint64 ts = 3;
}

// User renamed the session from the sidebar. custom_title="" clears the
// override (revert to auto title). Browser-initiated via coord SessionsRename
// → appendEvent, same path as workspace_assigned.
message RenamedEvt {
  string session_id = 1;
  string custom_title = 2;
  uint64 ts = 3;
}

// Worker resolved (or re-resolved on checkout) the git branch of the
// session's cwd. branch absent = folder isn't a git repo. Feeds the
// cell-grid folder-row subtitle (FolderList.tsx).
message GitEvt {
  string session_id = 1;
  optional string branch = 2;
  uint64 ts = 3;
  // GitHub "owner/repo" parsed from `git remote get-url origin`, present only
  // when the origin is a github.com remote. Feeds clickable owner/repo#123 +
  // bare #123 / commit-SHA terminal links. Absent = leave prior value alone.
  optional string remote = 4;
}

// Worker-resolved GitHub PR status for the session's branch. Absent number =
// no open PR for this branch. Feeds the #123 ✓ folder-row badge
// (FolderList.tsx). Resolved via `gh pr list --head <branch>` on the worker.
message PrEvt {
  string session_id = 1;
  optional int32 number = 2;                 // PR number; absent = no PR
  optional string state = 3;                 // "open"|"merged"|"closed"|"draft"
  optional string checks = 4;                // "passing"|"failing"|"pending"|"none"
  optional string url = 5;                   // html_url for click-through
  uint64 ts = 6;
}

// Worker-detected TCP ports the session's process tree is LISTENing on (via
// ps pid-tree + lsof). Feeds the :5174 folder-row chips (FolderList.tsx),
// click-through to http://<reachable_addr>:<port>. Empty = nothing listening.
message PortsEvt {
  string session_id = 1;
  repeated int32 ports = 2;
  uint64 ts = 3;
}

message SessionEventProto {
  uint64 event_id = 1;
  oneof kind {
    OpenedEvt opened = 10;
    ClosedEvt closed = 11;
    AttachedEvt attached = 12;
    DetachedEvt detached = 13;
    CwdEvt cwd = 14;
    WorkspaceAssignedEvt workspace_assigned = 15;
    AgentEvt agent = 16;
    SnapshotEvt snapshot = 17;
    RespawnedEvt respawned = 18;
    RenamedEvt renamed = 19;
    GitEvt git = 20;
    PrEvt pr = 21;
    PortsEvt ports = 22;
  }
}

// T1.2 part 2 — bus delta types. Wrap the existing entity protos with a
// `oneof kind` so consumers get typed dispatch without parsing JSON.

message WorkspaceSessionsSet {
  string workspace_id = 1;
  repeated string session_ids = 2;
  uint64 version = 3;
}
message WorkspaceDeltaProto {
  oneof kind {
    Workspace created = 1;
    Workspace updated = 2;
    string deleted_id = 3;
    WorkspaceSessionsSet sessions_set = 4;
  }
}

message TaskDeltaProto {
  oneof kind {
    Task created = 1;
    Task state = 2;
  }
}

message WebhookTokenDeltaProto {
  oneof kind {
    WebhookToken created = 1;
    string deleted_id = 2;
  }
}

// Pair-request delta (perf sweep C2.4 — replaces the SPA's 5 s pairList
// poller). `pending` upserts one request, `removed_id` drops one (approved
// or denied), `snapshot` carries the FULL pending set — seeded on every Sync
// connect so a reconnecting SPA replaces its set wholesale (removals that
// happened while it was disconnected can't linger; pairBus is volatile, B10).
message PairRequestDeltaProto {
  oneof kind {
    PairRequest pending = 1;
    string removed_id = 2;
    PairRequestsSnapshot snapshot = 3;
  }
}

message PairRequestsSnapshot {
  repeated PairRequest pending = 1;
}

message PermissionRuleDeltaProto {
  oneof kind {
    PermissionRule created = 1;
    PermissionRule updated = 2;
    string deleted_id = 3;
  }
}

message McpRelayEvent {
  string relay_id = 1;
  string payload_json = 2;
  uint64 ts = 3;
}
message McpStreamMessageProto {
  oneof kind {
    McpRelay created = 1;
    McpRelay updated = 2;
    string deleted_id = 3;
    McpRelayEvent event = 4;
  }
}

// Worker presence (post-MVP — workers/registered/heartbeat/removed share
// one oneof so the SPA's _handlePresenceEvent gets typed dispatch).
message WorkerHeartbeat {
  string worker_fp = 1;
  uint64 last_seen_ms = 2;
  optional HostMetrics host_metrics = 3;
}
message WorkerPresenceProto {
  oneof kind {
    Worker registered = 1;
    WorkerHeartbeat heartbeat = 2;
    string removed_fp = 3;
  }
}
