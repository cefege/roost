<!DOCTYPE html>
<html lang="en" data-density="dense">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-visual" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Terminal cols/rows come from CellTerminal's measured JetBrains Mono
         cell. Preloading removes the window where fallback metrics publish the
         wrong initial view geometry. MaterialSymbols is font-display:block;
         its preload only shortens FOIT. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/JetBrainsMonoNerdFontMono-Regular.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/MaterialSymbolsRounded.woff2" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>Roost</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #app {
        height: 100%;
        background: var(--bg-base);
        color: var(--text-hi);
        font-family: var(--md-font);
      }
      /* One policy for the whole app: nothing overscrolls. A drag that reaches
         the end of a list or of terminal scrollback stops there — no
         rubber-band, no pull-to-refresh, and no chaining into an ancestor
         scroller. A touch gesture the terminal owns can no longer be stolen by
         the browser mid-drag and turned into a page pull. */
      * { overscroll-behavior-y: none; }
      /* .workbench-shell owns 100svh and every list scrolls inside it, so the
         document must never acquire a scroll range of its own: `height: 100%`
         resolves against the LARGE viewport on mobile while the shell is sized
         in svh, which otherwise leaves ~one toolbar height of real page scroll. */
      html, body { overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
