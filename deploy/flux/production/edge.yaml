apiVersion: v1
kind: ConfigMap
metadata:
  name: roost-edge
  namespace: roost
data:
  Caddyfile: |
    :8080 {
      @missing not header CF-Connecting-IP *
      respond @missing "not found" 404
      @private path /internal /internal/* /api/db-export /api/db-export/*
      respond @private "not found" 404
      reverse_proxy roost-coordinator:4113 {
        header_up X-Forwarded-For {http.request.header.CF-Connecting-IP}
      }
    }
  cloudflared.yaml: |
    tunnel: 70b39358-d6da-41bb-8608-87f0e6559803
    ingress:
      - hostname: mike.roosttt.com
        service: http://127.0.0.1:8080
      - hostname: roosttt.com
        service: http://100.103.95.19:80
      - hostname: www.roosttt.com
        service: http://100.103.95.19:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roost-edge
  namespace: roost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: roost-edge
  template:
    metadata:
      labels:
        app: roost-edge
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: desktop-pc
      containers:
        - name: proxy
          image: caddy:2-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
        - name: tunnel
          image: cloudflare/cloudflared:2026.10.7
          args: [tunnel, --config, /etc/cloudflared/cloudflared.yaml, --no-autoupdate, run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: roost-tunnel
                  key: token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: roost-edge
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: roost-edge
  namespace: roost
spec:
  podSelector:
    matchLabels:
      app: roost-edge
  policyTypes: [Ingress]
  ingress: []
