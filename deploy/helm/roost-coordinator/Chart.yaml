apiVersion: v2
name: roost-coordinator
description: >-
  The Roost coordinator, stateless against a shared Postgres. One replica owns
  worker links; followers proxy connections to that owner. Workers run on real
  hosts and enroll with `roost add-machine`.
type: application
version: 0.1.0
appVersion: "3.0.0"
home: https://github.com/cefege/roost
sources:
