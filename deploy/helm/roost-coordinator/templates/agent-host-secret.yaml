{{- if .Values.agentHost.enabled }}
{{- $name := printf "%s-agent-host" (include "roost.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existingSecret := "" -}}
{{- if $existing -}}
{{- $existingSecret = (get $existing.data "ROOST_AGENT_HOST_SECRET" | default "" | b64dec) -}}
{{- end -}}
{{- $secret := $existingSecret -}}
{{- if not $secret -}}
{{- $secret = randAlphaNum 48 -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "roost.labels" . | nindent 4 }}
type: Opaque
stringData:
  ROOST_AGENT_HOST_SECRET: {{ $secret | quote }}
{{- end }}
