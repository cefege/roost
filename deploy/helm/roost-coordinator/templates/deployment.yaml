{{- if .Values.trustedProxyCidrs }}
{{- if not .Values.trustProxy }}
{{- fail "trustedProxyCidrs requires trustProxy: true" }}
{{- end }}
{{- else if .Values.trustProxy }}
{{- fail "trustProxy without trustedProxyCidrs pins the coordinator to a loopback bind no Service can reach; set trustedProxyCidrs" }}
{{- end }}
{{- if not (has (int .Values.replicas) (list 0 1)) }}
{{- fail "replicas must be 1, or 0 for maintenance: two coordinators would split sockets and fan-out" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roost.fullname" . }}
  labels:
    {{- include "roost.labels" . | nindent 4 }}
spec:
  # One replica is the contract, not a default: sockets, terminal replicas and
  # the bus are in-process, and two coordinators would split them. Recreate,
  # so a rollout never runs two at once.
  replicas: {{ int .Values.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "roost.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roost.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the database settings change.
        checksum/database: {{ toJson .Values.database | sha256sum }}
    spec:
      serviceAccountName: {{ include "roost.fullname" . }}
      automountServiceAccountToken: false
      # Under it, the coordinator's own 20 s drain bound finishes first.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: coordinator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["coord"]
          ports:
            - name: http
              containerPort: 4113
          envFrom:
            - secretRef:
                name: {{ include "roost.databaseSecret" . }}
          env:
            - name: ROOST_COORDINATOR_BIND
              value: "0.0.0.0:4113"
            - name: ROOST_TRUST_PROXY
              value: {{ ternary "1" "0" .Values.trustProxy | quote }}
            {{- if .Values.trustedProxyCidrs }}
            - name: ROOST_TRUSTED_PROXY_CIDRS
              value: {{ join "," .Values.trustedProxyCidrs | quote }}
            {{- end }}
            {{- with .Values.publicUrl }}
            - name: ROOST_WEB_PUBLIC_URL
              value: {{ . | quote }}
            - name: ROOST_CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # Endpoints drop the pod while this runs, before SIGTERM closes the
            # listener, so no new connection lands on a closing socket.
            preStop:
              sleep:
                seconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/roost
      volumes:
        # Scratch only: with a Postgres URL nothing durable is written here.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
