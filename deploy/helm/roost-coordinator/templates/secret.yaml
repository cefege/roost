{{- if not .Values.database.existingSecret }}
{{- $secretName := include "roost.databaseSecret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- /* `data` holds base64 of each env value; the key's env value is itself
     base64 of 32 bytes. `randBytes` already returns base64, so it is encoded
     once more; a key read back from the live Secret is stored as-is. */ -}}
{{- $storedKey := dig "data" "ROOST_COORDINATOR_SECRET_KEY" "" $existing -}}
{{- $secretKey := randBytes 32 | b64enc -}}
{{- if .Values.secretKey }}
{{- $secretKey = .Values.secretKey | b64enc -}}
{{- else if $storedKey }}
{{- $secretKey = $storedKey -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "roost.labels" . | nindent 4 }}
  annotations:
    # Uninstalling the release must not take the key every stored credential
    # is encrypted under; a reinstall's `lookup` picks this Secret up again.
    helm.sh/resource-policy: keep
type: Opaque
data:
  ROOST_COORDINATOR_SECRET_KEY: {{ $secretKey | quote }}
  ROOST_COORDINATOR_DATABASE_URL: {{ include "roost.databaseUrl" . | b64enc | quote }}
{{- end }}
