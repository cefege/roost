{{- if .Values.logs.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "roost.fullname" . }}-logs
  labels:
    {{- include "roost.labels" . | nindent 4 }}
  annotations:
    # The log outlives an uninstall; deleting it is a separate decision.
    helm.sh/resource-policy: keep
spec:
  # The node-local log volume is shared by pods pinned to the same node.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.logs.persistence.storage }}
{{- end }}
