# A coordinator on Postgres, on this machine.
#
#   docker compose up -d --build
#   docker compose exec coordinator roost add-browser   # prints the pairing URL
#
# The coordinator writes nothing durable to its own filesystem: every row is
# in the `postgres-data` volume. Workers run on real hosts; enroll one with
# `docker compose exec coordinator roost add-machine --platform linux` after
# declaring an HTTPS front door in ROOST_WEB_PUBLIC_URL.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roost
      POSTGRES_PASSWORD: roost
      POSTGRES_DB: roost
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roost -d roost"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  coordinator:
    build: .
    image: roost-coordinator:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ROOST_COORDINATOR_DATABASE_URL: postgres://roost:roost@postgres:5432/roost
      ROOST_CORS_ALLOWED_ORIGINS: http://127.0.0.1:4113
    ports:
      - "127.0.0.1:4113:4113"
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/roost
    restart: unless-stopped

volumes:
  postgres-data:
