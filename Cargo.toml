# Roost v3 workspace. Every crate lives under crates/; xtask owns the repo
# gates that replaced scripts/lint-boundaries.ts and scripts/lint-roost.ts.
# Dependency direction is one way and is enforced by `cargo xtask lint`, not by
# reviewer memory — see the allowlist in xtask/src/crate_dag.rs.

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/cefege/roost"

[workspace.dependencies]
# Internal crates, re-exported by name so every member depends on one version.
roost-proto = { path = "crates/roost-proto" }
roost-observability = { path = "crates/roost-observability" }
roost-protocol = { path = "crates/roost-protocol" }
roost-platform = { path = "crates/roost-platform" }
roost-host = { path = "crates/roost-host" }
roost-term = { path = "crates/roost-term" }
roost-keeper = { path = "crates/roost-keeper" }
roost-worker = { path = "crates/roost-worker" }
roost-coord = { path = "crates/roost-coord" }
roost-client-core = { path = "crates/roost-client-core" }
roost-web-terminal = { path = "crates/roost-web-terminal" }
roost-web = { path = "crates/roost-web" }

# Runtime and transport.
tokio = { version = "1.53.1", default-features = false }
axum = { version = "0.8.9", default-features = false }
connectrpc = "0.9.1"
connectrpc-build = "0.9.0"
buffa = "0.9.2"
sqlx = { version = "0.9.0", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
web-push = "0.11.0"
portable-pty = "0.9.0"
str0m = "0.23.1"
qrcode = "0.14.1"
idb = "0.6.5"
rust-embed = "8.12.0"
regex = "1.13.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
ammonia = "4.2.0"

# Crypto and encoding.
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
sha2 = "0.11.0"
hex = "0.4.3"

# Serialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Observability.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# CLI and errors.
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.104"

# Browser.
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = "0.3.106"
dioxus = "0.7.10"

# Shared plumbing.
futures = "0.3.34"
tokio-util = { version = "0.7.19", default-features = false }

# xtask only.
cargo_metadata = "0.23.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"

# Release binaries must be byte-reproducible: the keeper admission gate compares
# `implementation_digest` (SHA-256 of the roost-keeper binary) across releases,
# and a drifting digest is a "keeper binary changed" verdict, not a no-op.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
