[package]
name = "roost-llm"
description = "LLM providers, accounts and the judge for the Roost agent harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
roost-observability = { workspace = true }
async-stream = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls", "stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
xxhash-rust = { workspace = true }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "json", "query", "tokio"] }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[[test]]
name = "suite"
path = "tests/suite.rs"

