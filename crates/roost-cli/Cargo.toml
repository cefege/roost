[package]
name = "roost-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `roost` binary: coord, worker, deploy, status, doctor and the rest"
autotests = false

[lib]
name = "roost_cli"
path = "src/lib.rs"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
roost-coord.workspace = true
roost-host.workspace = true
roost-keeper.workspace = true
roost-observability.workspace = true
roost-platform.workspace = true
roost-proto.workspace = true
roost-protocol.workspace = true
roost-worker.workspace = true
# `client` here rather than in the workspace default: it pulls `mio` in through
# hyper, which does not build for `wasm32-unknown-unknown`, and the browser
# client is a first-class target of this workspace. Only the CLI dials.
connectrpc = { workspace = true, features = ["client", "client-tls"] }

# The generated client is constructed from an `http::Uri`, and nothing else in
# this crate's graph re-exports one: connectrpc re-exports only `http_body`,
# buffa only `alloc`, and reqwest's re-exports stop at `Url` and `header`. So
# without a carrier the generated stubs cannot be built at all, and `roost api`
# would be a table of hand-written paths — the exact thing it must not be. This
# is the one existing workspace pin that carries `http`, and the in-process test
# server is the same dependency, so it is a normal dependency rather than a
# dev-only one.
axum = { workspace = true, features = ["http1", "tokio"] }

clap.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "any"] }
qrcode.workspace = true
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "macros", "process", "rt", "rt-multi-thread", "signal", "time",
] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
rqrr.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
