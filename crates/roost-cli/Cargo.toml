[package]
name = "roost-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The `roost` binary: coord, worker, deploy, status, doctor and the rest"

[lib]
name = "roost_cli"
path = "src/lib.rs"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
roost-coord.workspace = true
roost-host.workspace = true
roost-keeper.workspace = true
roost-observability.workspace = true
roost-platform.workspace = true
roost-proto.workspace = true
roost-protocol.workspace = true
roost-worker.workspace = true
connectrpc.workspace = true

clap.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
thiserror.workspace = true
tokio = { workspace = true, features = [
    "macros", "process", "rt", "rt-multi-thread", "signal", "time",
] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
