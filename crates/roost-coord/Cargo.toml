[package]
name = "roost-coord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The coordinator service: SQLite state, auth, Connect RPC handlers, the Sync and worker WebSocket links, terminal hubs, and web push. Speaks the wire, never the terminal."

[dependencies]
# The push slice sends through the Web Push protocol; the maintenance slice
# streams a database file through gzip. Both were workspace pins no member
# declared, so neither resolved until here.
web-push.workspace = true
async-compression.workspace = true
# The `Interceptor` trait is declared with `#[async_trait]`, so an impl of it must
# carry the same attribute or the rewritten lifetimes disagree (E0195).
async-trait = "0.1"
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
base64.workspace = true
connectrpc = { workspace = true, features = ["server", "axum"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
roost-host.workspace = true
roost-observability.workspace = true
roost-platform.workspace = true
roost-proto.workspace = true
roost-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
roost-protocol.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
