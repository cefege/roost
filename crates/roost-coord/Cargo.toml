[package]
name = "roost-coord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The coordinator service: SQLite state, auth, Connect RPC handlers, the Sync and worker WebSocket links, terminal hubs, and web push. Speaks the wire, never the terminal."
autotests = false

[dependencies]
# The push slice sends through the Web Push protocol; the maintenance slice
# streams a database file through gzip. Both were workspace pins no member
# declared, so neither resolved until here.
web-push.workspace = true
# Never called: declared so feature unification turns on `vendored` for the
# OpenSSL web-push links. Removing it ships a binary that needs the build
# host's libssl. See the pin's comment in the root manifest.
openssl.workspace = true
async-compression.workspace = true
# The `Interceptor` trait is declared with `#[async_trait]`, so an impl of it must
# carry the same attribute or the rewritten lifetimes disagree (E0195).
async-trait = "0.1"
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
base64.workspace = true
connectrpc = { workspace = true, features = ["server", "axum"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
roost-host.workspace = true
roost-observability.workspace = true
roost-platform.workspace = true
roost-proto.workspace = true
roost-protocol.workspace = true
# The Deepgram reachability probe behind TranscriptionTest is the coordinator's
# only outbound HTTPS call. `rustls` matches the workspace pin; no `json`,
# because the probe reads the status line and nothing else.
reqwest = { workspace = true, features = ["rustls"] }
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `any` so one `CoordDb` serves a SQLite file or a Postgres URL; rustls so a
# managed Postgres that demands `sslmode=require` is reachable.
sqlx = { workspace = true, features = ["sqlite", "postgres", "any", "runtime-tokio", "macros", "migrate", "tls-rustls-ring-webpki"] }
thiserror.workspace = true
# The export route streams a database copy of unbounded size into a response
# body; `tokio_util::io::ReaderStream` is the named seam for a file as a body.
tokio-util = { workspace = true, features = ["io"] }
# `process` for the deploy job's `roost deploy` subprocess and its piped output.
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# The admission, security-header and CORS layers are three axum layers around
# the one router, and `tower_http` is where they live. Pinned in the root
# `[workspace.dependencies]` so no slice blocks the integrator mid-wave for a
# crate that was already decided.
tower-http.workspace = true

[dev-dependencies]
roost-protocol.workspace = true
serde_json.workspace = true
sha2.workspace = true
# `test-util` for `tokio::time::pause`, so a deadline test does not wait it out.
tokio = { workspace = true, features = ["test-util"] }
# The WebSocket client the worker-link and Sync upgrade tests dial a real
# ephemeral-port listener with; `connect` for `connect_async`.
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
