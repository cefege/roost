[package]
name = "roost-agent-tools"
description = "Worker-side tools for the Roost agent harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[lints]
workspace = true

[dependencies]
flate2 = { workspace = true }
globset = { workspace = true }
grep-regex = { workspace = true }
grep-searcher = { workspace = true }
ignore = { workspace = true }
lsp-types = { workspace = true }
roost-observability = { workspace = true }
roost-platform = { workspace = true }
roost-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
url = { workspace = true }
tokio-util = { workspace = true }
tar = { workspace = true }
tracing = { workspace = true }
getrandom = { workspace = true }
xxhash-rust = { workspace = true }
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
axum = { workspace = true, features = ["http1", "tokio"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
