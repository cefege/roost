[package]
name = "roost-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The worker service: sessions, the keeper client, the durable outbox, the coordinator link, the local door, the WebRTC peer, and agent tracking. Never depends on roost-coord."

[dependencies]
anyhow.workspace = true
base64.workspace = true
futures-util.workspace = true
roost-host.workspace = true
roost-keeper.workspace = true
roost-observability.workspace = true
roost-platform.workspace = true
roost-protocol.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time",
] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake"] }

# The six W-1 slices reach for these, and each was a workspace pin that no
# member declared, so none of them resolved until this wave. `roost-term` is
# the terminal core the session record holds; `sqlx` is the durable session
# event store; `str0m` is the peer's transport; `axum` is the door's server;
# `regex` is the scrollback matcher; `ed25519-dalek` signs the worker's
# coordinator credential.
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
ed25519-dalek.workspace = true
regex.workspace = true
roost-term.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
str0m.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }

[[bin]]
name = "roost-worker"
path = "src/bin/roost-worker.rs"

[lints]
workspace = true
