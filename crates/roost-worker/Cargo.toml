[package]
name = "roost-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The worker service: sessions, the keeper client, the durable outbox, the coordinator link, the local door, the WebRTC peer, and agent tracking. Never depends on roost-coord."
autotests = false

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
base64.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# The enrollment calls are the only place this crate speaks Connect, and
# `CallOptions`/`ClientTransport` live behind the `client` feature. A worker
# dials its coordinator over `http://` and `https://`, so `client-tls` is
# compiled in beside the plaintext transport; `coordinator_tls` builds the one
# TLS configuration the Connect client and the link share.
connectrpc = { workspace = true, features = ["client", "client-tls"] }
rustls.workspace = true
webpki-roots.workspace = true
roost-host.workspace = true
roost-keeper.workspace = true
roost-observability.workspace = true
roost-platform.workspace = true
roost-proto.workspace = true
roost-agent-tools.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
roost-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time",
] }
tokio-tungstenite = { workspace = true, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }

# The six W-1 slices reach for these, and each was a workspace pin that no
# member declared, so none of them resolved until this wave. `roost-term` is
# the terminal core the session record holds; `sqlx` is the durable session
# event store; `str0m` is the peer's transport; `axum` is the door's server;
# `regex` is the scrollback matcher; `ed25519-dalek` signs the worker's
# coordinator credential.
axum = { workspace = true, features = ["http1", "json", "query", "tokio", "ws"] }
ed25519-dalek.workspace = true
regex.workspace = true
roost-term.workspace = true
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
str0m.workspace = true
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
sysinfo.workspace = true

[dev-dependencies]
# The enrollment round trip needs a Connect SERVER to redeem against: the
# redemption and the registration are two calls over a socket, and a test that
# stubs them proves only that the worker called something. `server` is a
# dev-only feature — the worker itself only ever dials.
connectrpc = { workspace = true, features = ["client", "server"] }
tokio = { workspace = true, features = ["net", "rt", "rt-multi-thread", "macros", "time", "test-util"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
# The cgroup throttle trail is only observable as log events, so the test that
# pins it needs a recorder. `roost-observability` keeps its own inside
# `#[cfg(test)]`; a worker's tests cannot reach it.
tracing-subscriber.workspace = true

[[bin]]
name = "roost-worker"
path = "src/bin/roost-worker.rs"

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
