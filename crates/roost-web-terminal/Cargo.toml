[package]
name = "roost-web-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The imperative web-sys terminal renderer plus its input, IME, mouse, selection and link controllers. Owns the DOM contract and holds no framework code, so the state machine is testable outside a browser."

[lints]
workspace = true

[dependencies]
js-sys = { workspace = true }
roost-client-core = { workspace = true }
roost-protocol = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
wasm-bindgen = { workspace = true }

# The renderer touches the DOM directly and deliberately: one cell row is one
# element, and a virtual tree over it would put a diff between the replica and
# the painted grid on every frame. The features are exactly the surfaces the
# renderer owns — text, selection, input, IME composition, mouse, and the
# observer that turns a container's box into a PTY geometry.
[dependencies.web-sys]
workspace = true
features = [
  "AddEventListenerOptions",
  "Blob",
  "BlobPropertyBag",
  "CanvasRenderingContext2d",
  "CharacterData",
  "Clipboard",
  "ClipboardEvent",
  "CompositionEvent",
  "CssStyleDeclaration",
  "CustomEvent",
  "CustomEventInit",
  "DataTransfer",
  "Document",
  "DocumentFragment",
  "DomRect",
  "DomRectList",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusEvent",
  "FocusEventInit",
  "FocusOptions",
  "History",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlTextAreaElement",
  "IdleRequestOptions",
  "InputEvent",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "MutationObserver",
  "MutationObserverInit",
  "MutationRecord",
  "Node",
  "NodeList",
  "Performance",
  "PerformanceEntry",
  "PerformanceObserver",
  "PerformanceObserverEntryList",
  "PerformanceObserverInit",
  "PointerEvent",
  "Range",
  "ResizeObserver",
  "ResizeObserverEntry",
  "ResizeObserverSize",
  "ScrollBehavior",
  "ScrollToOptions",
  "Selection",
  "Text",
  "TextMetrics",
  "Touch",
  "TouchEvent",
  "TouchList",
  "Url",
  "VisualViewport",
  "WheelEvent",
  "Window",
]
