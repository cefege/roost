[package]
name = "roost-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"
description = "ROOST_* configuration, service names, durable atomic writes, and service health probes for both long-lived services. Depends on roost-protocol and roost-platform, and on nothing above them."
autotests = false

[dependencies]
base64.workspace = true
getrandom.workspace = true
hex.workspace = true
ipnet.workspace = true
roost-platform.workspace = true
roost-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "time", "rt"] }
url.workspace = true

[target.'cfg(windows)'.dependencies]
sysinfo.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
