[package]
name = "roost-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Dioxus 0.8 alpha web application with Libero UI and a session-keyed terminal renderer registry."
autotests = false

[lints]
workspace = true

[lib]
# The `dx serve`/`dx build` entry is a library with a `#[wasm_bindgen(start)]`
# bootstrap, because Dioxus mounts the virtual dom from `main` and the panic
# hook has to be installed before the first component renders.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
rqrr = { workspace = true }
dioxus-html = { workspace = true, features = ["serialize"] }

[dependencies]
roost-client-core = { workspace = true }
roost-platform = { workspace = true }
roost-protocol = { workspace = true }
roost-web-terminal = { workspace = true }
unicode-segmentation = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
# NOT optional: the settings panes persist product state in the coordinator's own
# saved form (the `roost.coords` address list, an MCP relay's `config_json`), so
# the derives and the codec are product code.
serde = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
qrcode = { workspace = true }
similar = { workspace = true }
libero = { workspace = true, features = [
  "pictogram", "use-id", "use-color-scheme", "use-popover", "use-media-query",
  "action-icon", "button", "button-group", "box", "text", "title", "code", "code-lang-rust", "paper", "flex",
  "text-field", "textarea", "checkbox", "switch", "radio-group",
  "segmented-control", "slider", "combobox", "dialog", "modal", "drawer",
  "menu", "spotlight", "tooltip", "hover-card", "accordion", "collapse", "sidebar",
  "nav-link", "scroll-area", "table", "list", "tabs", "alert", "badge",
  "chip", "avatar", "skeleton", "loader", "progress-bar", "circular-progress", "indicator", "kbd",
  "divider", "blockquote", "use-element",
] }
pictogram-icons-lucide = { workspace = true }
pictogram-core = { workspace = true }

thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `web` because the whole crate is a browser app; `router` because the route
# table in `src/routes.rs` is the URL contract.
[dependencies.dioxus]
workspace = true
features = ["web", "router"]

