# Dioxus 0.8 build configuration for the Roost web client.
# Read by `dx build`/`dx serve`; `dx` is not required to compile the crate.

[application]
name = "roost-web"
out_dir = "dist"
# Everything Dioxus serves statically is under `assets/`, so the stylesheets,
# fonts, icons, manifest and service worker land beside the bundle by ONE rule.
public_dir = "assets"

[web]
# The coordinator serves the built assets pre-compressed, and the CSS is ~180 KB
# of it, so the release build emits .gz/.br beside every asset.
pre_compress = true

[web.app]
title = "Roost"
# v2's Vite build set no `base`, so every URL is root-absolute. The coordinator
# serves the SPA from the origin root and a non-root base would 404 every
# router path the Playwright specs navigate to.
base_path = "/"

# Load order is load-bearing: `theme-vars.css` declares every token the rest
# `var()` into, and `gamepad.css` has to come after `tv.css` or the
# coarse-pointer overrides win. `NotificationDock.css` carries only the
# notify-target ring, an attribute selector over surfaces other components render.
[web.resource]
style = [
  "/styles/theme-vars.css",
  "/styles/product-motion.css",
  "/styles/terminal-grid.css",
  "/styles/tv.css",
  "/styles/gamepad.css",
  "/components/notifications/NotificationDock.css",
]

# dx 0.8 serves the resource list above without injecting additional styles.
[web.resource.dev]

[web.wasm_opt]
# `-Oz`. The wasm carries the cell renderer and the protobuf codecs, and the
# coordinator gzips what it serves, so size is the cheaper axis.
level = "z"
# Keeps the name section, so a panic in the Playwright oracle names the Rust
# function that panicked without a browser extension.
keep_names = true
