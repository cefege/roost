name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  invariants:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: install
        run: bun install
      - name: typecheck
        run: bun x tsgo -p tsconfig.base.json --noEmit
      - name: knip (dead-code report, report-only)
        run: bunx knip || true
      - name: unit
        run: bun run test:unit

  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    needs: invariants
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      # webkit is macOS-only here: playwright.config.ts drops the webkit-iphone
      # project off darwin, so installing that engine on Linux would only buy a
      # slow no-op (and RHEL/Ubuntu webkit system deps are the fragile part).
      - name: playwright install
        run: bunx playwright install --with-deps chromium ${{ matrix.os == 'macos-latest' && 'webkit' || '' }}
      - name: terminal
        run: bun run test:terminal
      - name: terminal artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-playwright-artifacts-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
