name: ci

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  invariants:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: install
        run: bun install
      - name: typecheck
        run: bun x tsgo -p tsconfig.base.json --noEmit
      - name: knip (dead-code report, report-only)
        run: bunx knip || true
      - name: unit
        run: bun run test:unit

  terminal:
    runs-on: macos-latest
    timeout-minutes: 20
    needs: invariants
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install
      - name: playwright install
        run: bunx playwright install --with-deps chromium webkit
      - name: terminal
        run: bun run test:terminal
      - name: terminal artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-playwright-artifacts
          path: |
            playwright-report/
            test-results/
