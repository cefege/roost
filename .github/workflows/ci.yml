name: ci

# v3 branch. The Rust gates and the TypeScript gates both run while the TS tree
# is still here; the `upgrade` and `wterm-wasm` tiers and release.yml return in
# Phase 7, once `smoke/` drives the Rust binaries instead of the TS ones.
on:
  push:
    branches: [main, v2, v3]
  pull_request:
    branches: [main, v2, v3]

jobs:
  rust:
    name: rust workspace
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: repo invariants
        run: cargo xtask lint
      # roost-client-core and roost-protocol are the two crates every future
      # front end links, and both must stay free of host-only dependencies.
      - name: wasm32 build
        run: cargo build -p roost-client-core -p roost-protocol --target wasm32-unknown-unknown

  invariants:
    name: typescript invariants (pre-deletion)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: typecheck
        run: bun x tsgo -p tsconfig.base.json --noEmit
      - name: lint (roost invariants — blocking)
        run: bun run lint
      - name: knip (dead-code report, report-only)
        run: bunx knip || true
      - name: unit
        run: bun run test:unit

  terminal:
    name: terminal (mixed stack oracle)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # 30, not 20: this tier absorbed the retired humanchrome skills' coverage
    # (render-stress on both screens, multi-viewer resize-hammer), and ubuntu
    # was cancelled mid-run at the 20-minute cap.
    timeout-minutes: 30
    needs: invariants
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # WebKit is macOS-only. Firefox runs only the peer-correctness project.
      - name: playwright install
        run: bunx playwright install --with-deps chromium firefox ${{ matrix.os == 'macos-latest' && 'webkit' || '' }}
      - name: terminal
        run: bun run test:terminal
      - name: terminal artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-playwright-artifacts-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/

  windows-2022:
    name: windows server 2022 deterministic gates
    # OFF by default, same gate as the v2 release workflow's Windows jobs.
    # These are still the TypeScript product's gates; they are re-derived when
    # the Rust worker and keeper have Windows coverage, which is not in scope
    # for v3 (Linux + macOS ship; Windows stays paused as on main).
    # Set repository variable ROOST_WINDOWS_GATE=on to turn the tier back on.
    if: vars.ROOST_WINDOWS_GATE == 'on'
    runs-on: windows-2022
    timeout-minutes: 60
    needs: invariants
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: bun install --frozen-lockfile
      - name: Windows invariants
        run: |
          bun x tsgo -p tsconfig.base.json --noEmit
          bun test --isolate packages/ apps/coord/tests/ apps/web/tests/ apps/roost-cli/tests/ smoke/bun_smoke.test.ts
      - name: Windows PowerShell 5.1 bootstrap compatibility
        shell: powershell
        run: .\scripts\windows\verify-powershell51-bootstrap.ps1
      - name: Native keeper and ConPTY
        run: >-
          bun test
          apps/worker/tests/keeper-history-resume.test.ts
          apps/worker/tests/keeper-input-stress.test.ts
          apps/worker/tests/keeper-child-reap.test.ts
          apps/worker/tests/host/listening-ports.test.ts
      - name: Install and update invariants
        run: bun test --isolate apps/roost-cli/tests/
      - name: Install Playwright Chromium artifact
        run: bunx playwright install chromium
      - name: Terminal on Chromium
        run: bun run test:terminal
      - name: Windows Chromium, Edge, terminal and package artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-2022-artifacts
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
