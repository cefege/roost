name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium ${{ matrix.os == 'macos-15' && 'webkit' || '' }}
      - run: bun x tsgo -p tsconfig.base.json --noEmit
      - run: bun run test:unit
      - run: bun run test:terminal

  build:
    name: build release candidates
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Require tag to match package version
        run: |
          PACKAGE_VERSION="$(bun -e 'process.stdout.write((await Bun.file("package.json").json()).version)')"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION" >&2
            exit 1
          fi
      - run: bun scripts/build-binary.ts
      - name: Verify compatibility asset and checksums
        run: |
          cmp dist/roost dist/roost-darwin-arm64
          cd dist
          for asset in roost roost-darwin-arm64 roost-darwin-x64 roost-linux-x64 roost-linux-arm64; do
            shasum -a 256 "$asset" | awk '{print $1}' > "$asset.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          if-no-files-found: error
          path: |
            dist/roost
            dist/roost.sha256
            dist/roost-darwin-arm64
            dist/roost-darwin-arm64.sha256
            dist/roost-darwin-x64
            dist/roost-darwin-x64.sha256
            dist/roost-linux-x64
            dist/roost-linux-x64.sha256
            dist/roost-linux-arm64
            dist/roost-linux-arm64.sha256

  native-smoke:
    name: native smoke (${{ matrix.runner }} / ${{ matrix.asset }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: roost
            file_marker: "arm64"
          - runner: macos-15-intel
            asset: roost-darwin-x64
            file_marker: "x86_64"
          - runner: ubuntu-24.04
            asset: roost-linux-x64
            file_marker: "x86-64"
          - runner: ubuntu-24.04-arm
            asset: roost-linux-arm64
            file_marker: "aarch64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: dist
      - name: Exercise native candidate
        env:
          ASSET: ${{ matrix.asset }}
          FILE_MARKER: ${{ matrix.file_marker }}
        run: |
          set -euo pipefail
          cd dist
          chmod 0755 "$ASSET"
          FILE_OUTPUT="$(file "$ASSET")"
          echo "$FILE_OUTPUT"
          case "$FILE_OUTPUT" in
            *"$FILE_MARKER"*) ;;
            *) echo "unexpected architecture for $ASSET" >&2; exit 1 ;;
          esac
          PACKAGE_VERSION="$(bun -e 'process.stdout.write((await Bun.file("../package.json").json()).version)')"
          CANDIDATE_VERSION="$("./$ASSET" version)"
          case "$CANDIDATE_VERSION" in
            "$PACKAGE_VERSION"+?*) ;;
            *) echo "unexpected version: $CANDIDATE_VERSION" >&2; exit 1 ;;
          esac
          export HOME="$(mktemp -d)"
          "./$ASSET" quickstart --dry-run
          INSTALL_DIR="$(mktemp -d)"
          ROOST_LOCAL_BIN="$PWD/$ASSET" ROOST_BIN_DIR="$INSTALL_DIR" bash ../install-binary.sh
          INSTALLED_VERSION="$("$INSTALL_DIR/roost" version)"
          test "$INSTALLED_VERSION" = "$CANDIDATE_VERSION"

  publish:
    name: publish GitHub Release
    # Windows is off the release path (see windows-verify's gate); publishing
    # waits only on the assets it actually ships.
    needs: [native-smoke]
    runs-on: ubuntu-24.04
    env:
      PUBLIC_RELEASE_ASSETS: |-
        dist/roost
        dist/roost.sha256
        dist/roost-darwin-arm64
        dist/roost-darwin-arm64.sha256
        dist/roost-darwin-x64
        dist/roost-darwin-x64.sha256
        dist/roost-linux-x64
        dist/roost-linux-x64.sha256
        dist/roost-linux-arm64
        dist/roost-linux-arm64.sha256
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: dist
      - name: Require complete canonical public asset set
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          actual="$(mktemp)"
          printf '%s\n' "$PUBLIC_RELEASE_ASSETS" | sed 's#^dist/##' | LC_ALL=C sort > "$expected"
          test "$(wc -l < "$expected")" -eq 10
          find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: ${{ env.PUBLIC_RELEASE_ASSETS }}

  windows-verify:
    name: verify Windows Server 2022
    # OFF by default: the Windows suite is red for environment reasons (temp-dir
    # EBUSY in coord-move, POSIX-only deploy fixtures, launchd timeouts), and it
    # blocked v0.4.0 and v0.4.1 from publishing at all. Set repository variable
    # ROOST_WINDOWS_GATE=on to put Windows back in the release path; that also
    # re-enables windows-release, whose signed assets must be added back to
    # publish's PUBLIC_RELEASE_ASSETS and its count.
    if: vars.ROOST_WINDOWS_GATE == 'on'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: bun install --frozen-lockfile
      - name: Windows invariant gate
        run: |
          bun x tsgo -p tsconfig.base.json --noEmit
          bun test --isolate apps/shared/tests/ apps/coord/tests/ apps/web/tests/ apps/roost-cli/tests/ smoke/bun_smoke.test.ts
      - name: Stock Windows PowerShell 5.1 bootstrap gate
        shell: powershell
        run: .\scripts\windows\verify-powershell51-bootstrap.ps1
      - name: Native keeper and ConPTY gate
        run: >-
          bun test
          apps/worker/tests/keeper-history-resume.test.ts
          apps/worker/tests/keeper-input-stress.test.ts
          apps/worker/tests/keeper-child-reap.test.ts
          apps/worker/tests/listening-ports.test.ts
      - name: Install and update gate
        run: bun test --isolate apps/roost-cli/tests/
      - name: Coordinator move gate
        run: >-
          bun test
          apps/coord/tests/coordinator-move-handlers.test.ts
          apps/coord/tests/coordinator-move-orchestrator.test.ts
          apps/coord/tests/coordinator-move-e2e.test.ts
      - name: Install Playwright Chromium artifact
        run: bunx playwright install chromium
      - name: Terminal gate on Chromium
        run: bun run test:terminal
      - name: Build Windows candidate with generated embeds
        run: bun scripts/build-binary.ts --windows-only
      - name: Build Windows SDK helper with static CRT
        shell: pwsh
        run: ./scripts/windows/build-helper.ps1
      - name: Embedded SPA on Chromium artifact
        run: >-
          bun scripts/windows/smoke-embedded-assets.ts
          --binary dist/roost-windows-x64.exe
          --channel chromium
          --artifact-dir test-results/release-windows-chromium
      - name: Embedded SPA on installed Edge
        run: >-
          bun scripts/windows/smoke-embedded-assets.ts
          --binary dist/roost-windows-x64.exe
          --channel msedge
          --artifact-dir test-results/release-windows-edge
      - name: Windows browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-browser-artifacts
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/

  windows-release:
    name: sign and package Windows release
    if: vars.ROOST_WINDOWS_GATE == 'on'
    needs: [verify, windows-verify, build]
    runs-on: windows-2022
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: bun install --frozen-lockfile
      - name: Require tag, Shawl pins and protected signing identity
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          ROOST_WINDOWS_PUBLISHER_SHA256: ${{ secrets.ROOST_WINDOWS_PUBLISHER_SHA256 }}
          SHAWL_WIN64_SHA256: f883c5d09c9beae2efaeabd8513e7d3f57cd1d0864cec3df4f4a7b6ee904351c
          SHAWL_LEGAL_SHA256: a2a1743a64b79922062906eb32cdaf23db131769f8cabcc98e5d57bbf66eb0b0
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "tag does not match package version v$version" }
          foreach ($name in @("WINDOWS_SIGNING_PFX_BASE64", "WINDOWS_SIGNING_PFX_PASSWORD", "ROOST_WINDOWS_PUBLISHER_SHA256", "SHAWL_WIN64_SHA256", "SHAWL_LEGAL_SHA256")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "$name is a release blocker and is missing" }
          }
          if ($env:ROOST_WINDOWS_PUBLISHER_SHA256 -notmatch "^[0-9a-fA-F]{64}$") { throw "ROOST_WINDOWS_PUBLISHER_SHA256 must be 64 hex" }
          if ($env:SHAWL_WIN64_SHA256 -ne "f883c5d09c9beae2efaeabd8513e7d3f57cd1d0864cec3df4f4a7b6ee904351c") { throw "Shawl win64 pin changed" }
          if ($env:SHAWL_LEGAL_SHA256 -ne "a2a1743a64b79922062906eb32cdaf23db131769f8cabcc98e5d57bbf66eb0b0") { throw "Shawl legal pin changed" }
          try { $null = [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64) } catch { throw "WINDOWS_SIGNING_PFX_BASE64 is invalid" }
      - name: Build versioned Windows PE and embedded assets
        run: |
          bun run --cwd apps/web build
          bun scripts/build-binary.ts --windows-only
      - name: Build helper with Windows SDK and /MT
        shell: pwsh
        run: ./scripts/windows/build-helper.ps1
      - name: Authenticode sign, timestamp, checksum and package
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          ROOST_WINDOWS_PUBLISHER_SHA256: ${{ secrets.ROOST_WINDOWS_PUBLISHER_SHA256 }}
          WINDOWS_TIMESTAMP_URL: https://timestamp.digicert.com
          SHAWL_WIN64_SHA256: f883c5d09c9beae2efaeabd8513e7d3f57cd1d0864cec3df4f4a7b6ee904351c
          SHAWL_LEGAL_SHA256: a2a1743a64b79922062906eb32cdaf23db131769f8cabcc98e5d57bbf66eb0b0
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $publishedAt = ([DateTimeOffset]::Parse((git show -s --format=%cI HEAD))).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          ./scripts/windows/package-windows.ps1 -Version $version -PublishedAt $publishedAt
          ./scripts/windows/verify-windows-package.ps1
          ./dist/windows-package/install.ps1 -InstallRoot (Join-Path $env:RUNNER_TEMP "roost-install-smoke") -StageOnly
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidates
          if-no-files-found: error
          path: |
            dist/roost-windows-x64.zip
            dist/roost-windows-x64.zip.sha256
            dist/roost-windows-x64.manifest.json
            dist/roost-windows-x64.manifest.json.sha256
            dist/roost-windows-x64.manifest.json.p7s
            dist/roost-windows-x64.manifest.json.p7s.sha256
            dist/join.ps1
            dist/join.ps1.sha256
            dist/install-binary.ps1
            dist/install-binary.ps1.sha256
