name: release

# Triggered by a v3 tag. Every asset name below is a value from
# `crates/roost-cli/src/update/assets.rs` -- `release_asset_name` for the roost
# binary, `keeper_release_asset_name` for the keeper beside it, and
# `WEB_ASSET_NAME` for the page. They are NOT derived from the target triple:
# macOS arm64 publishes an unsuffixed `roost`, so a workflow that named assets
# after triples would publish `roost-aarch64-apple-darwin` and 404 on the one
# platform with the most machines. `install.sh`'s `asset_name` resolves the
# four macOS and Linux names and `install.ps1` the Windows pair, and a machine
# that installs by script and a machine that later runs `roost update` must end
# up on the same release. Five triples are built.
#
# `crates/roost-cli/tests/release_asset_names.rs` fails if the names here stop
# matching that table, or if this file's verify job stops running ci.yml's
# commands. It checks the STRINGS. It cannot check that a `cp` path is right,
# which is why the staging step below reads `target/<triple>/release` -- the
# layout cargo produces when `--target` is passed, and the layout it does not
# produce without it.
on:
  push:
    tags: ['v3.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v3.0.0-rc.1)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate, verbatim from ci.yml's `rust` job. A release that skips a step the
  # merge gate runs can ship what the merge gate would have refused, and a
  # release that runs a step the merge gate does not is the same defect wearing
  # a different hat. Copy, never retype.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      # The same cache, and the same shared key, as ci.yml's `rust` job: this
      # job runs that job's commands, so a release tag should not pay for the
      # dependency build a merge of the same lockfile already paid for.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-gates
          add-job-id-key: false
      - name: fmt
        run: cargo xtask fmt
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: test
        run: cargo nextest run --workspace
      - name: doctests
        run: cargo test --workspace --doc
      - name: repo invariants
        run: cargo xtask lint
      - name: vendored terminal core
        run: cargo test --manifest-path third_party/alacritty_terminal/Cargo.toml
      - name: wasm32 build
        run: cargo build -p roost-client-core -p roost-protocol -p roost-web -p roost-web-terminal --target wasm32-unknown-unknown

  build:
    name: ${{ matrix.roost_asset }}
    runs-on: ${{ matrix.runner }}
    env:
      # The tag, stamped into both programs by roost-host's build.rs. A joined
      # machine fetches the page published under it, and each release installs
      # into a directory named for it, so two releases sit side by side. Unset,
      # every release reported `dev` and installed over the last.
      ROOST_BUILD_VERSION: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Linux rows link through zig against the glibc they name, which
          # is the oldest glibc the binary starts on. The runner's own linker
          # records the runner's glibc instead: ubuntu-24.04's 2.39 fails to
          # start on AlmaLinux 9 and Debian 11 with "version `GLIBC_2.38' not
          # found". The arm64 row cross-links from the same x86_64 runner.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            glibc: '2.28'
            roost_asset: roost-linux-x64
            keeper_asset: roost-keeper-linux-x64
          - runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            glibc: '2.28'
            roost_asset: roost-linux-arm64
            keeper_asset: roost-keeper-linux-arm64
          - runner: macos-15
            target: aarch64-apple-darwin
            roost_asset: roost
            keeper_asset: roost-keeper
          # Cross-compiled: macos-15 is arm64, so this row needs the target
          # installed explicitly. rust-toolchain.toml only adds wasm32.
          - runner: macos-15
            target: x86_64-apple-darwin
            roost_asset: roost-darwin-x64
            keeper_asset: roost-keeper-darwin-x64
          # The C runtime is linked statically, so the binaries need nothing
          # beyond the system DLLs every Windows 11 machine ships.
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            exe: '.exe'
            rustflags: '-C target-feature=+crt-static'
            roost_asset: roost-windows-x64.exe
            keeper_asset: roost-keeper-windows-x64.exe
    steps:
      # include_str! bakes the agent integration sources into the binary, and
      # their import-marker regex expects LF lines, as the Unix builds see them.
      - name: keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: install the target
        run: rustup target add ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.glibc
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@v2
        if: matrix.glibc
        with:
          tool: cargo-zigbuild@0.23.4
      # aws-lc-sys assembles with NASM on Windows; llvm-readobj lists imports.
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - name: llvm tools
        if: runner.os == 'Windows'
        run: rustup component add llvm-tools
      - name: build
        if: ${{ !matrix.glibc }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release -p roost-cli -p roost-keeper --target ${{ matrix.target }}
      - name: build against the row's glibc
        if: matrix.glibc
        run: cargo zigbuild --release -p roost-cli -p roost-keeper --target ${{ matrix.target }}.${{ matrix.glibc }}
      - name: the binaries load nothing a fleet machine may lack
        shell: bash
        run: |
          set -euo pipefail
          out="target/${{ matrix.target }}/release"
          for bin in roost${{ matrix.exe }} roost-keeper${{ matrix.exe }}; do
            if [ "${{ runner.os }}" = Linux ]; then
              # glibc's own libraries and the gcc runtime ship on every
              # distribution. Any other NEEDED entry is the runner's copy of a
              # library, at a soname a fleet machine may not have.
              extra="$(readelf -d "$out/$bin" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' \
                | grep -vE '^(libc|libm|libpthread|libdl|librt|libutil|libgcc_s)\.so\.[0-9]+$|^ld-linux-[a-z0-9_-]+\.so\.[0-9]+$' || true)"
              newest="$(readelf -V "$out/$bin" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)"
              floor="GLIBC_${{ matrix.glibc }}"
              if [ "$(printf '%s\n%s\n' "$newest" "$floor" | sort -V | tail -1)" != "$floor" ]; then
                echo "::error::$bin needs $newest, newer than the $floor it was linked for"
                exit 1
              fi
            elif [ "${{ runner.os }}" = Windows ]; then
              # The system DLLs and API sets every Windows 11 machine ships.
              # Anything else, such as a VC++ runtime, is one a machine may lack.
              readobj="$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-msvc/bin/llvm-readobj.exe"
              [ -x "$readobj" ] || readobj="$(find "$(rustc --print sysroot)" -name 'llvm-readobj*' | head -1)"
              extra="$("$readobj" --coff-imports "$out/$bin" | sed -n 's/^ *Name: *//p' | tr -d '\r' \
                | grep -viE '^(kernel32|advapi32|ws2_32|userenv|ntdll|bcrypt|bcryptprimitives|crypt32|ole32|oleaut32|shell32|user32|secur32|ncrypt|iphlpapi|psapi|powrprof|pdh|netapi32|dbghelp|api-ms-win-.*)\.dll$' || true)"
            else
              # /usr/lib and /System ship with macOS. Anything else is the
              # runner's, such as Homebrew's OpenSSL, and a Mac without it
              # cannot start the binary.
              extra="$(otool -L "$out/$bin" | tail -n +2 | awk '{print $1}' \
                | grep -vE '^(/usr/lib/|/System/Library/)' || true)"
            fi
            if [ -n "$extra" ]; then
              echo "::error::$bin links libraries a fleet machine may not have: $extra"
              exit 1
            fi
            echo "$bin links only libraries every machine of its platform ships"
          done
      - name: stage under the published names, with a digest beside each
        shell: bash
        run: |
          set -euo pipefail
          # `--target` puts artifacts in target/<triple>/release, NOT
          # target/release/<triple>. The latter is the path a build without
          # --target produces, and it is empty here.
          out="target/${{ matrix.target }}/release"
          test -x "$out/roost${{ matrix.exe }}"        || { echo "::error::$out/roost${{ matrix.exe }} missing"; exit 1; }
          test -x "$out/roost-keeper${{ matrix.exe }}" || { echo "::error::$out/roost-keeper${{ matrix.exe }} missing"; exit 1; }
          mkdir -p dist
          cp "$out/roost${{ matrix.exe }}"        "dist/${{ matrix.roost_asset }}"
          cp "$out/roost-keeper${{ matrix.exe }}" "dist/${{ matrix.keeper_asset }}"
          chmod +x "dist/${{ matrix.roost_asset }}" "dist/${{ matrix.keeper_asset }}"
          # macOS runners ship `shasum`, not `sha256sum`; install.sh's `sha256_of`
          # falls back for the same reason. The sidecar FORMAT is the standard
          # `<hash>  <name>`, which install.sh's `fetch_roost` parses with `cut -d' ' -f1`.
          for asset in "${{ matrix.roost_asset }}" "${{ matrix.keeper_asset }}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              ( cd dist && sha256sum "$asset" > "$asset.sha256" )
            else
              ( cd dist && shasum -a 256 "$asset" > "$asset.sha256" )
            fi
            echo "published $asset $(cut -d' ' -f1 "dist/$asset.sha256")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-bin-${{ matrix.target }}
          path: dist/

  # ONE page serves all five targets: it is the same build, differing only in
  # which binaries serve it. A per-platform bundle would be five chances to
  # invent a name the installer does not fetch.
  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-gates
          add-job-id-key: false
      - name: wasm target and dx
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install dioxus-cli --version 0.7.10 --locked
      # dx never prunes old hashed files from public/, hence the rm. `--profile
      # release` is rejected by cargo under dx, so the wasm builds under
      # `wasm-release`.
      - name: build the production page
        run: |
          rm -rf target/dx/roost-web/release/web/public
          dx build --release --profile wasm-release -p roost-web --platform web
          test -f target/dx/roost-web/release/web/public/index.html
      - name: the bundle must carry no test backdoor
        run: |
          set -euo pipefail
          # `window.__smoke` was the deleted Playwright oracle's backdoor; a
          # production page carrying it is a page anyone can drive.
          if grep -rl '__smoke' target/dx/roost-web/release/web/public; then
            echo "::error::the web bundle contains __smoke; this is not a production bundle"
            exit 1
          fi
          mkdir -p dist
          tar -czf dist/roost-web.tar.gz -C target/dx/roost-web/release/web public
          ( cd dist && sha256sum roost-web.tar.gz > roost-web.tar.gz.sha256 )
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [verify, build, web]
    steps:
      # Only the tag's release notes are read from the tree, and they are read
      # from the TAG, so the notes a release publishes are the ones gated with it.
      # Checked out before the downloads: checkout empties the workspace.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          sparse-checkout: docs/release-notes
      - uses: actions/download-artifact@v4
        with:
          pattern: release-bin-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: dist
      - name: every asset the installer resolves is here, with its digest
        run: |
          set -euo pipefail
          missing=0
          for a in roost roost-linux-x64 roost-linux-arm64 roost-darwin-x64 \
                   roost-keeper roost-keeper-linux-x64 roost-keeper-linux-arm64 \
                   roost-keeper-darwin-x64 roost-windows-x64.exe \
                   roost-keeper-windows-x64.exe roost-web.tar.gz; do
            if [ ! -f "dist/$a" ]; then
              echo "::error::dist/$a was never published"
              missing=1
              continue
            fi
            if [ ! -f "dist/$a.sha256" ]; then
              # The installer refuses an unverified asset, so an asset without a
              # sidecar is not a release that half works -- it is a release
              # where one platform's machines cannot install at all.
              echo "::error::dist/$a.sha256 missing; the installer refuses an unverified asset"
              missing=1
              continue
            fi
            echo "ok  $a  $(cut -d' ' -f1 "dist/$a.sha256")"
          done
          test "$missing" -eq 0
          echo "all eleven assets present with digests"
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Names the repository explicitly; the sparse checkout above is for the
          # notes, not for `gh` to infer a remote from.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # `--prerelease` keeps GitHub's `latest` OFF an rc. It does not hide
          # the rc from v3's own install or update: both list releases and
          # filter `v3.` tags, and a pre-release build or
          # ROOST_RELEASE_CHANNEL=prerelease opts into rcs.
          #
          # `--latest=false` keeps GitHub's `latest` on v2's last release for
          # a STABLE v3 too, because v2 reads nothing else. v2's `roost update`
          # (v0.5.0 `apps/roost-cli/src/update.ts`) asks
          # `/releases/latest` for a tag, treats any different version as an
          # update, downloads `releases/latest/download/<asset>` under the same
          # four names this workflow publishes, and renames it over its own
          # executable with no compatibility check -- a v2 machine would become
          # a v3 `roost` with no keeper, still started by v2's service units.
          # v2's install-binary.sh and Windows join read `latest` as well. v3
          # never reads `latest`, so this costs v3 nothing.
          #
          # `--verify-tag` refuses to create the tag it was handed. Without it a
          # mistyped `workflow_dispatch` input mints a new tag on the default
          # branch, and the release it publishes points at a commit nothing ever
          # gated -- the one outcome this pipeline exists to make impossible.
          notes=(--generate-notes)
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            notes=(--notes-file "docs/release-notes/${TAG}.md")
          fi
          if [[ "$TAG" == *-rc* ]]; then
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
              "${notes[@]}" --prerelease
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
              "${notes[@]}" --latest=false
          fi
          echo "published $TAG with ${notes[*]}"
