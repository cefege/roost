name: release

# Cut a release by pushing a tag:  git tag v0.1.0 && git push --tags
# Builds the single `roost` binary (SPA + migrations + wasm embedded) on macOS
# and attaches it + its sha256 to the GitHub Release that `roost update` and the
# curl/Homebrew installers pull from.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-binary.ts
      - name: checksum
        run: shasum -a 256 dist/roost | awk '{print $1}' | tee dist/roost.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/roost
            dist/roost.sha256
