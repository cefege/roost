name: container

# The coordinator image, ghcr.io/cefege/roost-coordinator: `edge` and the
# commit sha from every v3 push, the version from every v3.* tag. linux/amd64
# only — a Rust + wasm build under QEMU is impractical; arm64 needs a native
# runner.
on:
  push:
    branches: [v3]
    tags: ["v3.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: coordinator image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # A release build of the workspace plus the wasm bundle does not fit in
      # the ~14 GB a hosted runner leaves free on /; these trees are unused here.
      - name: free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/roost-coordinator
          tags: |
            type=sha
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/v3' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v3.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ROOST_BUILD_VERSION=${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
            ROOST_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-host-image:
    name: agent host image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/roost-agent-host
          tags: |
            type=sha
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/v3' }}
            type=match,pattern=v(.*),group=1,enable=${{ startsWith(github.ref, 'refs/tags/v3.') }}
      - uses: docker/build-push-action@v6
        with:
          context: agent-host
          file: agent-host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
