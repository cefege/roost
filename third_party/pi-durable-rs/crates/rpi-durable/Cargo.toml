[package]
name = "rpi-durable"
description = "Port of @earendil-works/pi-durable storage stack: experimental durable task runtime (chord subset, Memory/JSONL/SQLite backends)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Crash-survival helper for the SQLite `kill -9` test (FR-E R4).
[[bin]]
name = "rpi-durable-crash-writer"
path = "tests/fixtures/crash-writer.rs"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
# Model message types reused from rpi-ai (upstream types.ts:3 type-only
# `Message`/`Models` import from @earendil-works/pi-ai).
rpi-ai.workspace = true
rpi-codemode.workspace = true
base64.workspace = true
jsonschema.workspace = true
# FR-C R4 ruling (2026-10-14): rusqlite + spawn_blocking over sqlx. `bundled`
# compiles SQLite into the binary, so the musl static single-file release
# rusqlite 0.39 caches prepared statements per SQL text (Connection::prepare_cached)
# shared across transactions (FR-D R4).
rusqlite = { version = "0.39", default-features = false, features = ["bundled", "cache"] }
# [N/A-struct] `diff` package: the jsdiff-compatible Myers diff and unified
# patch writer are hand-ported (edit-diff.ts consumes `createTwoFilesPatch` and
# `diffLines`); see `tools/edit_diff.rs` for the FR-C R2 ruling.
# NFKC fuzzy matching + NFD read-path variants (edit-diff.ts/path-utils.ts).
unicode-normalization.workspace = true
# V17-15 FR-C: native file-change events for the durable ExecutionEnv watcher
# (`node-watch.ts` consumes `fs.watch` + snapshot rescans).
notify = "8.2"
sha2.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }