// Browser ↔ direct worker terminal carrier. A browser can use the worker's
// loopback listener or a negotiated WebRTC peer connection, while keystrokes
// and cell frames never traverse the coordinator. The payload messages are
// the same ones Sync carries (sync.proto) — one wire shape across direct
// carriers — and only the hello, ready, scrollback and close frames are
// terminal-transport-specific.

syntax = "proto3";
package roost.v1;

import "roost/v1/cell.proto";
import "roost/v1/sync.proto";
// ScrollbackHistoryFloor is defined beside the coordinator RPC that first
// needed it; the local socket reuses that vocabulary rather than forking one.
import "roost/v1/coordinator.proto";

// Presented once, before any other client frame, after a direct carrier opens.
// The secret was minted by the coordinator and installed here as a digest; the
// worker never learns it from the browser's origin alone.
message LocalTerminalHello {
  string grant_id = 1;
  string secret = 2;
  string tab_id = 3;
  string device_fingerprint = 4;
  string peer_id = 5;
  string worker_epoch = 6;
}

message LocalTerminalReady {
  string worker_fingerprint = 1;
  repeated string session_ids = 2;
  uint64 socket_generation = 3;
  string worker_epoch = 4;
  string socket_id = 5;
  string peer_id = 6;
}

message LocalTerminalClosed {
  string reason = 1;
}

// Mirrors SessionsGetScrollbackCells over a direct terminal carrier.
// `request_id` correlates the reply because the carrier has no RPC framing.
message LocalScrollbackRequest {
  string request_id = 1;
  string session_id = 2;
  uint64 end_row = 3;
  uint32 max_rows = 4;
  string grid_epoch = 5;
}

message LocalScrollbackResponse {
  string request_id = 1;
  repeated PbCellRow rows = 2;
  uint32 cols = 3;
  uint64 scrollback_total = 4;
  uint64 start_row = 5;
  uint64 end_row = 6;
  string grid_epoch = 7;
  ScrollbackHistoryFloor history_floor = 8;
  string error = 9;
}

message LocalTerminalClientFrame {
  oneof frame {
    LocalTerminalHello hello = 1;
    TerminalViewCommand terminal_view = 2;
    TerminalResyncCommand terminal_resync = 3;
    InputCommand input = 4;
    LocalScrollbackRequest scrollback = 5;
    TerminalInputRouteClaim input_route_claim = 6;
    TerminalTransportProbe transport_probe = 7;
  }
}

message LocalTerminalServerFrame {
  oneof frame {
    LocalTerminalReady ready = 1;
    TerminalViewStateFrame terminal_view_state = 2;
    PbCellGridFrame cell_grid = 3;
    PbCellGridChunk cell_grid_chunk = 4;
    InputAccepted input_accepted = 5;
    InputRejected input_rejected = 6;
    InputAmbiguous input_ambiguous = 7;
    LocalScrollbackResponse scrollback = 8;
    LocalTerminalClosed closed = 9;
    TerminalInputRouteResult input_route_result = 10;
    TerminalTransportProbeResult transport_probe_result = 11;
  }
}
